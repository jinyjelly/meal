<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#304b37">
  <title>나의 식단</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #f6f7f4;
      --card: #ffffff;
      --text: #222722;
      --muted: #788078;
      --line: #e1e5df;
      --green: #304b37;
      --green-soft: #e7eee8;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", "Segoe UI", sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .app {
      width: min(1080px, calc(100% - 28px));
      margin: 30px auto 70px;
    }
    header h1 { margin: 0; font-size: 29px; letter-spacing: -.5px; }
    header p { margin: 7px 0 22px; color: var(--muted); }
    .tabs {
      display: flex; gap: 4px; background: #e9ece7; padding: 4px;
      border-radius: 14px; margin-bottom: 24px;
    }
    .tab {
      flex: 1; border: 0; padding: 12px; border-radius: 11px;
      background: transparent; cursor: pointer; font-weight: 700; color: #657066;
    }
    .tab.active {
      background: var(--card); color: var(--green);
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .month-header, .day-nav {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; margin-bottom: 16px;
    }
    .month-header h2 { margin: 0; font-size: 22px; }
    .icon-btn {
      border: 0; background: var(--card); min-width: 44px; height: 44px;
      border-radius: 12px; cursor: pointer; font-size: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.035);
    }
    .weekdays, .calendar { display: grid; grid-template-columns: repeat(7, 1fr); }
    .weekday {
      text-align: center; padding: 10px 4px; color: var(--muted);
      font-size: 13px; font-weight: 700;
    }
    .weekday:first-child { color: #b35c5c; }
    .calendar { gap: 6px; }
    .day {
      min-height: 140px; background: var(--card); border-radius: 14px;
      padding: 10px; cursor: pointer; overflow: hidden;
      border: 2px solid transparent; transition: .15s ease;
      position: relative;
    }
    .day:hover { border-color: #aebdaf; transform: translateY(-1px); }
    .day.today { border-color: var(--green); }
    .day.empty { background: transparent; cursor: default; }
    .day.empty:hover { border-color: transparent; transform: none; }
    .day-number { font-weight: 800; margin-bottom: 8px; }
    .day.has-meal .day-number::after {
      content: ""; display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: #6e8e75; margin-left: 6px; vertical-align: 2px;
    }
    .meal-preview {
      font-size: 11px; line-height: 1.45; margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .meal-preview b { color: #6d786e; font-weight: 700; margin-right: 3px; }
    .add-hint {
      position: absolute; right: 9px; bottom: 7px; color: #a0aaa1;
      font-size: 20px; opacity: .65;
    }
    .day-view { max-width: 720px; margin: auto; }
    .day-nav input {
      flex: 1; border: 1px solid transparent; background: var(--card);
      padding: 12px; height: 44px; border-radius: 12px; color: var(--text);
    }
    .meal-card {
      background: var(--card); padding: 20px; border-radius: 17px;
      margin-bottom: 13px; box-shadow: 0 3px 15px rgba(0,0,0,.035);
    }
    .meal-card h3 { margin: 0 0 12px; font-size: 17px; }
    textarea {
      width: 100%; min-height: 88px; resize: vertical;
      border: 1px solid var(--line); border-radius: 11px;
      padding: 12px; outline: none; color: var(--text); background: #fff;
    }
    textarea:focus, .day-nav input:focus { border-color: #718875; }
    .save-message {
      text-align: center; height: 20px; margin: 15px;
      color: var(--muted); font-size: 13px;
    }
    .back {
      width: 100%; padding: 14px; border: 0; border-radius: 12px;
      background: var(--green); color: white; font-weight: 700; cursor: pointer;
    }
    .hidden { display: none; }
    .note {
      margin-top: 18px; text-align: center; color: #8b928b; font-size: 12px;
    }
    @media (max-width: 700px) {
      .app { width: calc(100% - 18px); margin-top: 20px; }
      header h1 { font-size: 26px; }
      .calendar { gap: 3px; }
      .day { min-height: 105px; padding: 6px; border-radius: 9px; }
      .day-number { font-size: 13px; margin-bottom: 5px; }
      .meal-preview { font-size: 9px; margin-bottom: 2px; }
      .weekday { font-size: 11px; padding: 7px 2px; }
      .add-hint { font-size: 16px; right: 6px; bottom: 4px; }
    }
  </style>
</head>
<body>
<main class="app">
  <header>
    <h1>🥗 나의 식단</h1>
    <p>한 달의 식단을 한눈에 보고, 날짜별로 간단하게 기록하세요.</p>
  </header>

  <div class="tabs">
    <button id="monthTab" class="tab active">월간 보기</button>
    <button id="dayTab" class="tab">하루 식단</button>
  </div>

  <section id="monthView">
    <div class="month-header">
      <button id="prevMonth" class="icon-btn" aria-label="이전 달">‹</button>
      <h2 id="monthTitle"></h2>
      <button id="nextMonth" class="icon-btn" aria-label="다음 달">›</button>
    </div>

    <div class="weekdays">
      <div class="weekday">일</div><div class="weekday">월</div>
      <div class="weekday">화</div><div class="weekday">수</div>
      <div class="weekday">목</div><div class="weekday">금</div>
      <div class="weekday">토</div>
    </div>
    <div id="calendar" class="calendar"></div>
    <p class="note">식단 데이터는 이 브라우저에 저장됩니다.</p>
  </section>

  <section id="dayView" class="day-view hidden">
    <div class="day-nav">
      <button id="prevDay" class="icon-btn" aria-label="이전 날">←</button>
      <input type="date" id="datePicker">
      <button id="nextDay" class="icon-btn" aria-label="다음 날">→</button>
    </div>

    <div id="mealContainer"></div>
    <div id="saveMessage" class="save-message"></div>
    <button id="backToMonth" class="back">월간 식단으로 돌아가기</button>
  </section>
</main>

<script>
const meals = [
  { id: "breakfast", name: "🌅 아침", label: "아침" },
  { id: "lunch", name: "☀️ 점심", label: "점심" },
  { id: "dinner", name: "🌙 저녁", label: "저녁" },
  { id: "snack", name: "🍎 간식", label: "간식" }
];

const monthView = document.getElementById("monthView");
const dayView = document.getElementById("dayView");
const monthTab = document.getElementById("monthTab");
const dayTab = document.getElementById("dayTab");
const calendar = document.getElementById("calendar");
const monthTitle = document.getElementById("monthTitle");
const datePicker = document.getElementById("datePicker");
const mealContainer = document.getElementById("mealContainer");
const saveMessage = document.getElementById("saveMessage");

let calendarDate = new Date();

function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function todayString() { return formatDate(new Date()); }
function storageKey(date) { return `meal-plan-${date}`; }

meals.forEach(meal => {
  const card = document.createElement("div");
  card.className = "meal-card";
  card.innerHTML = `
    <h3>${meal.name}</h3>
    <textarea id="${meal.id}" placeholder="${meal.label} 메뉴를 입력하세요"></textarea>
  `;
  mealContainer.appendChild(card);
});

datePicker.value = todayString();

function getSaved(date) {
  try {
    return JSON.parse(localStorage.getItem(storageKey(date)) || "{}");
  } catch {
    return {};
  }
}

function saveMeals() {
  const data = {};
  meals.forEach(meal => data[meal.id] = document.getElementById(meal.id).value);
  localStorage.setItem(storageKey(datePicker.value), JSON.stringify(data));

  saveMessage.textContent = "✓ 자동 저장되었습니다";
  clearTimeout(window.messageTimer);
  window.messageTimer = setTimeout(() => saveMessage.textContent = "", 1200);
  renderCalendar();
}

function loadMeals() {
  const data = getSaved(datePicker.value);
  meals.forEach(meal => {
    document.getElementById(meal.id).value = data[meal.id] || "";
  });
}

mealContainer.addEventListener("input", saveMeals);

function renderCalendar() {
  calendar.innerHTML = "";
  const year = calendarDate.getFullYear();
  const month = calendarDate.getMonth();
  monthTitle.textContent = `${year}년 ${month + 1}월`;

  const firstDay = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    calendar.appendChild(empty);
  }

  for (let day = 1; day <= lastDate; day++) {
    const date = new Date(year, month, day);
    const dateString = formatDate(date);
    const saved = getSaved(dateString);
    const hasMeal = meals.some(meal => (saved[meal.id] || "").trim());

    const cell = document.createElement("div");
    cell.className = "day";
    if (dateString === todayString()) cell.classList.add("today");
    if (hasMeal) cell.classList.add("has-meal");

    let preview = "";
    meals.forEach(meal => {
      const value = (saved[meal.id] || "").trim();
      if (value) {
        const shortText = value.replace(/\n/g, ", ");
        preview += `<div class="meal-preview"><b>${meal.label}</b>${escapeHtml(shortText)}</div>`;
      }
    });

    cell.innerHTML = `
      <div class="day-number">${day}</div>
      ${preview}
      ${hasMeal ? "" : '<div class="add-hint">＋</div>'}
    `;

    cell.addEventListener("click", () => {
      datePicker.value = dateString;
      calendarDate = new Date(year, month, day);
      loadMeals();
      showDayView();
    });

    calendar.appendChild(cell);
  }
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function showMonthView() {
  monthView.classList.remove("hidden");
  dayView.classList.add("hidden");
  monthTab.classList.add("active");
  dayTab.classList.remove("active");
  renderCalendar();
}

function showDayView() {
  monthView.classList.add("hidden");
  dayView.classList.remove("hidden");
  monthTab.classList.remove("active");
  dayTab.classList.add("active");
}

monthTab.addEventListener("click", showMonthView);
dayTab.addEventListener("click", () => { loadMeals(); showDayView(); });

document.getElementById("prevMonth").addEventListener("click", () => {
  calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() - 1, 1);
  renderCalendar();
});
document.getElementById("nextMonth").addEventListener("click", () => {
  calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 1);
  renderCalendar();
});

function moveDay(amount) {
  const date = new Date(datePicker.value + "T12:00:00");
  date.setDate(date.getDate() + amount);
  datePicker.value = formatDate(date);
  calendarDate = new Date(date);
  loadMeals();
}
document.getElementById("prevDay").addEventListener("click", () => moveDay(-1));
document.getElementById("nextDay").addEventListener("click", () => moveDay(1));

datePicker.addEventListener("change", () => {
  if (!datePicker.value) return;
  const selected = new Date(datePicker.value + "T12:00:00");
  calendarDate = new Date(selected);
  loadMeals();
});
document.getElementById("backToMonth").addEventListener("click", showMonthView);

loadMeals();
renderCalendar();
</script>
</body>
</html>
