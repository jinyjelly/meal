<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#304b37">
<title>주간 식단</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f6f7f4;--card:#fff;--text:#222722;--muted:#7b837c;--line:#e2e6e1;--green:#304b37;--soft:#e7eee8}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,textarea{font:inherit}
.app{width:min(760px,calc(100% - 16px));margin:18px auto 55px}
h1{margin:0 0 5px;font-size:26px;letter-spacing:-.5px}
header p{margin:0;color:var(--muted);font-size:13px}
.nav{display:flex;align-items:center;gap:8px;margin:18px 0 9px}
.nav-title{flex:1;text-align:center;font-weight:800;font-size:15px}
.icon{border:0;background:var(--card);width:42px;height:42px;border-radius:12px;font-size:19px;cursor:pointer;box-shadow:0 2px 9px rgba(0,0,0,.04)}
.this-week{display:block;margin:0 auto 14px;border:0;background:var(--soft);color:var(--green);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:800;cursor:pointer}
.table-wrap{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.035)}
.grid{display:grid;grid-template-columns:70px repeat(3,minmax(0,1fr))}
.cell{min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.grid>.cell:nth-child(4n){border-right:0}
.head{padding:11px 4px;text-align:center;font-size:12px;font-weight:800;background:#f2f5f1;color:#58655b}
.day{padding:10px 4px;text-align:center;background:#fbfcfa;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.day strong{font-size:13px}
.day span{font-size:10px;color:var(--muted)}
.day.today{background:var(--soft)}
.day.today strong{color:var(--green)}
.meal{padding:5px;min-height:78px}
.meal textarea{width:100%;height:66px;border:0;resize:none;outline:none;background:transparent;padding:6px 4px;font-size:12px;line-height:1.35;color:var(--text);text-align:center}
.meal textarea::placeholder{color:#b1b7b1}
.note{text-align:center;color:#969c96;font-size:11px;margin:15px 0}
.toast{position:fixed;left:50%;bottom:17px;transform:translateX(-50%);background:#263a2c;color:#fff;padding:8px 13px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.18s}
.toast.show{opacity:1}
@media(max-width:430px){
 .app{width:calc(100% - 10px);margin-top:13px}
 h1{font-size:24px}
 .grid{grid-template-columns:59px repeat(3,minmax(0,1fr))}
 .head{font-size:11px;padding:10px 2px}
 .day{padding:8px 2px}
 .day strong{font-size:12px}
 .meal{padding:3px;min-height:73px}
 .meal textarea{height:65px;font-size:11px;padding:5px 2px}
}
</style>
</head>
<body>
<main class="app">
<header>
<h1>🥗 주간 식단</h1>
<p>한 주의 아침·점심·저녁을 한눈에 비교하세요.</p>
</header>

<div class="nav">
<button class="icon" id="prev" aria-label="이전 주">‹</button>
<div class="nav-title" id="title"></div>
<button class="icon" id="next" aria-label="다음 주">›</button>
</div>
<button class="this-week" id="now">이번 주로 이동</button>

<section class="table-wrap">
<div class="grid" id="grid"></div>
</section>
<p class="note">각 칸을 눌러 입력하면 이 브라우저에 자동 저장됩니다.</p>
</main>
<div class="toast" id="toast">✓ 저장됨</div>

<script>
const TYPES=[["breakfast","🌅 아침"],["lunch","☀️ 점심"],["dinner","🌙 저녁"]];
const DAYS=["일","월","화","수","목","금","토"];
const grid=document.getElementById("grid");
const title=document.getElementById("title");
const toast=document.getElementById("toast");
let anchor=new Date();

function fmt(d){
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function monday(d){
 const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
 const n=x.getDay();
 x.setDate(x.getDate()+(n===0?-6:1-n));
 return x;
}
function load(ds){
 try{return JSON.parse(localStorage.getItem("meal-plan-"+ds)||"{}")}catch{return{}}
}
function esc(s){
 const e=document.createElement("div"); e.textContent=s; return e.innerHTML;
}
function render(){
 const start=monday(anchor);
 const end=new Date(start); end.setDate(end.getDate()+6);
 title.textContent=`${start.getFullYear()}년 ${start.getMonth()+1}/${start.getDate()} – ${end.getMonth()+1}/${end.getDate()}`;
 grid.innerHTML=`<div class="cell head">요일</div>${TYPES.map(x=>`<div class="cell head">${x[1]}</div>`).join("")}`;
 const today=fmt(new Date());

 for(let i=0;i<7;i++){
   const d=new Date(start); d.setDate(start.getDate()+i);
   const ds=fmt(d), saved=load(ds);
   grid.insertAdjacentHTML("beforeend",
     `<div class="cell day ${ds===today?"today":""}">
        <strong>${DAYS[d.getDay()]}요일</strong>
        <span>${d.getMonth()+1}/${d.getDate()}${ds===today?" · 오늘":""}</span>
      </div>`+
     TYPES.map(([id])=>`<div class="cell meal"><textarea data-date="${ds}" data-type="${id}" placeholder="메뉴">${esc(saved[id]||"")}</textarea></div>`).join("")
   );
 }
}
grid.addEventListener("input",e=>{
 if(!e.target.matches("textarea")) return;
 const ds=e.target.dataset.date, type=e.target.dataset.type;
 const obj=load(ds); obj[type]=e.target.value;
 localStorage.setItem("meal-plan-"+ds,JSON.stringify(obj));
 toast.classList.add("show");
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>toast.classList.remove("show"),750);
});
document.getElementById("prev").onclick=()=>{anchor.setDate(anchor.getDate()-7);render()};
document.getElementById("next").onclick=()=>{anchor.setDate(anchor.getDate()+7);render()};
document.getElementById("now").onclick=()=>{anchor=new Date();render()};
render();
</script>
</body>
</html>
